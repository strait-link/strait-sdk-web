name: OpenAPI drift
# Daily: does the pinned openapi.json still match the live API for what this SDK uses (POST /v1/match and
# MatchResult)? Any difference fails this run; test/openapi-contract.test.ts checks the SDK against the pin.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openapi-drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/openapi-drift.mjs
