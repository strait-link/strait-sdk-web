name: Release
# Push a tag vX.Y.Z (matching package.json "version") to publish @straitlink/web to npm.
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret exists or is needed.
# One-time setup (first manual publish + linking this workflow on npmjs.com): docs/FIRST-PUBLISH.md
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance attestation
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # trusted publishing needs Node >= 22.14
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for trusted publishing)
        run: |
          npm install -g npm@^11.5.1
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm '+process.argv[1]+' < 11.5.1');process.exit(1)}" "$(npm --version)"
          node --version; npm --version
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/brand.mjs --release
      - name: Publish to npm (trusted publishing, provenance on)
        run: npm publish --access public
